<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kitty樂園">
<meta name="theme-color" content="#ffd6e7">
<title>Hello Kitty 樂園 · 學英文換裝闖關</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}
  html,body{height:100%;}
  body{background:#ffe6f0;color:#7a3a55;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .app{width:100%;max-width:520px;height:100%;max-height:940px;display:flex;flex-direction:column;position:relative;overflow:hidden;}
  .hidden{display:none!important;}
  .btn{background:#ff8fb8;color:#fff;font-weight:900;border:none;border-radius:16px;padding:15px;font-size:21px;cursor:pointer;box-shadow:0 6px 0 #e06a97;transition:.05s;width:100%;}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #e06a97;}

  /* login */
  #login{margin:auto;text-align:center;padding:26px;}
  #login .logo{font-size:88px;margin-bottom:6px;}
  #login h1{font-size:30px;font-weight:900;margin-bottom:8px;color:#e0568e;}
  #login p{font-size:15px;opacity:.85;margin-bottom:24px;}
  #login input{width:100%;font-size:22px;padding:14px 18px;border:none;border-radius:16px;text-align:center;color:#7a3a55;font-weight:700;margin-bottom:14px;box-shadow:0 3px 10px rgba(224,86,142,.18);}

  #game{height:100%;display:flex;flex-direction:column;}
  .hud{display:flex;align-items:center;gap:8px;padding:12px 14px 6px;}
  .hud .coin{background:#fff;border-radius:999px;padding:6px 14px;font-weight:900;font-size:16px;color:#e0568e;box-shadow:0 2px 8px rgba(224,86,142,.15);}
  .hud .who{flex:1;text-align:center;font-weight:900;font-size:15px;color:#c94f86;}
  .hud .wbtn{background:#fff;border:none;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:900;color:#e0568e;cursor:pointer;box-shadow:0 2px 8px rgba(224,86,142,.15);}
  .hint{text-align:center;font-size:12px;color:#c98ba9;font-weight:700;padding:0 14px 4px;}

  /* 陸地地圖 */
  .land{flex:1;margin:6px 14px;border-radius:26px;position:relative;overflow:hidden;
    background:linear-gradient(180deg,#bfe9ff 0%,#dff5ff 40%,#cdeeb0 55%,#a9e08c 100%);
    box-shadow:inset 0 2px 0 #fff,0 6px 18px rgba(224,120,160,.2);cursor:pointer;}
  .land .sun{position:absolute;top:16px;right:20px;width:42px;height:42px;border-radius:50%;background:radial-gradient(circle,#fff3b0,#ffd54a);box-shadow:0 0 24px #ffe58a;}
  .prop{position:absolute;font-size:44px;transform:translate(-50%,-50%);filter:drop-shadow(0 3px 3px rgba(60,90,60,.2));pointer-events:none;}
  .npc{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:pointer;z-index:3;}
  .npc .ni{font-size:52px;line-height:1;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 5px 4px rgba(120,60,90,.25));}
  .npc .nn{font-size:11px;font-weight:900;color:#a34b76;background:rgba(255,255,255,.8);border-radius:999px;padding:1px 7px;margin-top:2px;}
  .npc .bubble{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:16px;}
  .chest{position:absolute;transform:translate(-50%,-50%);font-size:34px;cursor:pointer;z-index:2;filter:drop-shadow(0 3px 3px rgba(60,60,20,.3));}
  .chest.opened{opacity:.4;}
  .fspot{position:absolute;transform:translate(-50%,-50%);font-size:30px;cursor:pointer;z-index:2;filter:drop-shadow(0 2px 2px rgba(60,90,60,.3));animation:bob 3s ease-in-out infinite;}
  .fspot.cd{opacity:.3;filter:grayscale(1);pointer-events:none;}
  .ingreq{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
  .ingchip{font-size:13px;font-weight:800;border-radius:12px;padding:6px 10px;display:inline-flex;align-items:center;gap:2px;}
  .ingchip small{font-size:10px;opacity:.7;margin-left:2px;}
  .ingchip.ok{background:#dff5e4;color:#3bb56e;border:2px solid #9fe0b5;}
  .ingchip.no{background:#ffe6ec;color:#e0568e;border:2px solid #ffc2d4;}
  /* Hello Kitty 玩家 */
  .kitty{position:absolute;transform:translate(-50%,-100%);z-index:5;transition:left .6s ease,top .6s ease;text-align:center;pointer-events:none;}
  .kitty .ksh{width:44px;height:10px;margin:2px auto 0;background:rgba(60,110,60,.22);border-radius:50%;filter:blur(2px);}
  /* ===== 紙娃娃：白身體+貓頭，衣服一層層平面套上去（可換成平面PNG） ===== */
  .doll{position:relative;width:130px;height:190px;margin:0 auto;}
  .doll .dbody{position:absolute;top:56px;left:50%;transform:translateX(-50%);width:62px;height:74px;background:#fff;border:2px solid #f2cad9;border-radius:26px 26px 14px 14px;}
  .doll .dlegL,.doll .dlegR{position:absolute;top:126px;width:20px;height:50px;background:#fff;border:2px solid #f2cad9;border-radius:10px 10px 12px 12px;}
  .doll .dlegL{left:41px} .doll .dlegR{right:41px}
  .doll .dhead{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:62px;height:54px;}
  /* 畫出來的 Hello Kitty 娃娃臉（取代醜 emoji） */
  .kface{position:relative;width:62px;height:54px;}
  .kface .khd{position:absolute;left:3px;top:9px;width:56px;height:43px;background:#fff;border:2px solid #eebccd;border-radius:50% 50% 46% 46%;z-index:2;}
  .kface .kear{position:absolute;top:3px;width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:15px solid #fff;z-index:1;}
  .kface .kear.l{left:3px;transform:rotate(-22deg);filter:drop-shadow(-1px -1px 0 #eebccd);}
  .kface .kear.r{right:3px;transform:rotate(22deg);filter:drop-shadow(1px -1px 0 #eebccd);}
  .kface .keye{position:absolute;top:26px;width:6px;height:9px;background:#4a3138;border-radius:50%;z-index:3;}
  .kface .keye.l{left:18px;} .kface .keye.r{right:18px;}
  .kface .knose{position:absolute;top:33px;left:50%;transform:translateX(-50%);width:11px;height:7px;background:#ffcf5a;border-radius:50%;z-index:3;}
  .kface .kwk{position:absolute;height:2px;background:#e6c3d0;border-radius:2px;z-index:3;}
  .kface .kwk.l1{left:-8px;top:31px;width:13px;} .kface .kwk.l2{left:-8px;top:37px;width:12px;transform:rotate(9deg);}
  .kface .kwk.r1{right:-8px;top:31px;width:13px;} .kface .kwk.r2{right:-8px;top:37px;width:12px;transform:rotate(-9deg);}
  .kface .kbow{position:absolute;top:9px;right:-2px;z-index:4;width:22px;height:14px;}
  .kface .kbow span{position:absolute;top:0;width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;}
  .kface .kbow span.bl{left:0;border-right:11px solid #ff7fa8;}
  .kface .kbow span.br{right:0;border-left:11px solid #ff7fa8;}
  .kface .kbow::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:6px;height:6px;background:#ff5c8f;border-radius:50%;}
  .doll .dl{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;line-height:1;}
  .doll .dl img{object-fit:contain;}
  .doll .p-head{top:-10px;font-size:24px;}
  .doll .p-head2{top:4px;left:64%;font-size:22px;}
  .doll .p-face{top:24px;font-size:22px;}
  .doll .p-neck{top:48px;font-size:18px;}
  .doll .p-torso{top:58px;font-size:40px;} .doll .p-torso img{max-width:66px;max-height:80px;}
  .doll .p-torso2{top:54px;font-size:46px;} .doll .p-torso2 img{max-width:72px;max-height:88px;}
  .doll .p-legs{top:122px;font-size:34px;} .doll .p-legs img{max-width:60px;max-height:60px;}
  .doll .p-feet{top:170px;font-size:22px;}
  .doll .p-wrist{top:96px;left:74%;font-size:16px;}
  .doll .p-side{top:84px;left:22%;font-size:24px;}
  .kitty .dollmini{transform:scale(1.5);transform-origin:bottom center;}

  /* bottom sheet */
  .sheetwrap{position:absolute;inset:0;background:rgba(90,40,70,.35);display:flex;align-items:flex-end;z-index:20;}
  .sheet{background:#fff;width:100%;max-height:86%;border-radius:24px 24px 0 0;padding:12px 16px 18px;display:flex;flex-direction:column;box-shadow:0 -6px 24px rgba(120,60,90,.25);animation:up .25s ease;overflow:auto;}
  @keyframes up{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .grab{width:44px;height:5px;background:#f0d5e2;border-radius:999px;margin:2px auto 10px;flex:none;}
  .lhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .ltitle{font-weight:900;font-size:17px;flex:1;color:#c94f86;}
  .close{background:#ffe6f0;border:none;border-radius:999px;width:34px;height:34px;font-size:18px;cursor:pointer;color:#c94f86;}
  .ask{font-size:14px;color:#c98ba9;text-align:center;font-weight:700;}
  .zh{font-size:40px;font-weight:900;text-align:center;margin:6px 0 2px;color:#a34b76;}
  .speak{display:block;margin:2px auto 12px;background:#ffe6f0;color:#e0568e;border:none;border-radius:999px;padding:8px 18px;font-size:15px;font-weight:800;cursor:pointer;}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
  .opt{background:#fff5fa;color:#7a3a55;border:2px solid #ffd6e7;border-radius:14px;padding:18px 6px;font-size:22px;font-weight:900;cursor:pointer;}
  .opt:active{transform:scale(.97);}
  .opt.right{background:#5ccf8a;border-color:#3bb56e;color:#fff;}
  .opt.wrong{background:#ff6b8a;border-color:#e6476b;color:#fff;}
  .craftbtn{padding:10px 4px;line-height:1.2;}
  .craftmade{min-height:70px;background:#fff5fa;border:2px dashed #ffd6e7;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:40px;margin:6px 0;}
  .craftmade .mstep{font-size:36px;}
  .cttip{text-align:center;font-size:15px;font-weight:800;color:#c94f86;margin:6px 0 10px;}

  /* 衣櫃 */
  .wardgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .witem{border:2px solid #ffe0ec;border-radius:14px;padding:12px 4px;text-align:center;cursor:pointer;background:#fff8fb;}
  .witem.locked{opacity:.4;}
  .witem.on{border-color:#ff8fb8;background:#ffe6f0;}
  .witem .wi{font-size:34px;height:50px;display:flex;align-items:center;justify-content:center;} .witem .wi img{max-width:48px;max-height:48px;object-fit:contain;} .witem .wn{font-size:11px;font-weight:800;color:#a34b76;margin-top:3px;}
  .wcat{font-weight:900;font-size:13px;color:#c94f86;margin:12px 0 6px;}
  .wcat:first-child{margin-top:2px;}
  .witem.owned{opacity:.55;} .witem .wprice{font-size:11px;font-weight:900;color:#e0568e;margin-top:2px;}

  .toast{position:fixed;top:32%;left:50%;transform:translate(-50%,-50%) scale(0);background:rgba(90,30,60,.9);color:#fff;padding:18px 28px;border-radius:18px;font-size:22px;font-weight:900;transition:transform .18s;z-index:40;text-align:center;max-width:82%;}
  .toast.show{transform:translate(-50%,-50%) scale(1);}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
  .pdiff{display:flex;gap:8px;justify-content:center;margin:8px 0 12px;}
  .pdiff button{background:#ffd6e7;color:#c94f86;border:none;border-radius:12px;padding:10px 12px;font-weight:900;font-size:14px;cursor:pointer;}
  .pdiff button.on{background:#ff8fb8;color:#fff;}
  .pgrid{display:grid;gap:6px;margin:0 auto;background:#ffe6f0;padding:8px;border-radius:14px;}
  .ptile{background:linear-gradient(160deg,#ff9ec4,#ff7fb0);color:#fff;font-weight:900;border:none;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #e06a97;}
  .ptile:active{transform:translateY(2px);box-shadow:0 1px 0 #e06a97;}
  .ptile.empty{background:transparent;box-shadow:none;pointer-events:none;}
  .pmsg{text-align:center;font-size:13px;color:#c98ba9;font-weight:700;margin-top:8px;}
</style>
</head>
<body>
<div class="app">

  <div id="login">
    <div class="logo">🎀</div>
    <h1>Hello Kitty 樂園</h1>
    <p>在樂園裡走走、找寶箱、幫朋友答題，收集可愛衣服髮飾！</p>
    <input id="nameInput" maxlength="8" placeholder="輸入你的名字">
    <button class="btn" onclick="start()">進入樂園 →</button>
  </div>

  <div id="game" class="hidden">
    <div class="hud">
      <div class="coin">🪙 <span id="coins">0</span></div>
      <div class="coin">💎 <span id="diamonds">0</span></div>
      <div class="who"><span id="who">Kitty 樂園</span></div>
      <button class="wbtn" onclick="openPuzzle()">🧩 拼圖</button>
      <button class="wbtn" onclick="openShop()">🛒 商店</button>
      <button class="wbtn" onclick="openWard()">👗 衣櫃</button>
      <button class="wbtn" onclick="openBag()">🧺 食材</button>
      <button class="wbtn" onclick="cloudLogin()">☁️ 存檔</button>
    </div>
    <div class="hint">點地面讓 Kitty 走過去 · 點朋友做料理 · 每分鐘有寶箱出現、走過去找 🎁</div>

    <div class="land" id="land" onclick="landTap(event)">
      <div class="sun"></div>
      <!-- props / npcs / chest / kitty 由 JS 佈置 -->
      <div class="kitty" id="kitty" style="left:50%;top:78%;">
        <div class="doll dollmini" id="kittyDoll"></div>
        <div class="ksh"></div>
      </div>
    </div>
  </div>

  <!-- 做料理任務 -->
  <div class="sheetwrap hidden" id="taskWrap"><div class="sheet">
    <div class="grab"></div>
    <div class="lhead"><div class="ltitle" id="taskTitle">🐰 做料理</div><button class="close" onclick="closeSheet('taskWrap')">✕</button></div>
    <div id="craftBody"></div>
  </div></div>

  <!-- 商店：用金幣買衣服髮飾 -->
  <div class="sheetwrap hidden" id="shopWrap"><div class="sheet">
    <div class="grab"></div>
    <div class="lhead"><div class="ltitle">🛒 商店（🪙 <span id="shopCoins">0</span> · 💎 <span id="shopDia">0</span>）</div><button class="close" onclick="closeSheet('shopWrap')">✕</button></div>
    <p style="font-size:12px;color:#c98ba9;font-weight:700;margin-bottom:8px;">用金幣買想要的衣服髮飾（買了直接進衣櫃）。金幣去做料理／開寶箱賺 🪙</p>
    <div id="shopBody"></div>
  </div></div>

  <!-- 衣櫃換裝 -->
  <div class="sheetwrap hidden" id="wardWrap"><div class="sheet">
    <div class="grab"></div>
    <div class="lhead"><div class="ltitle">👗 Kitty 的衣櫃</div><button class="close" onclick="closeSheet('wardWrap')">✕</button></div>
    <div class="doll" id="dollPreview" style="margin:0 auto 6px"></div>
    <p style="font-size:12px;color:#c98ba9;font-weight:700;margin-bottom:8px;text-align:center">點一下換上（再點一下脫掉）→ 娃娃立刻穿上。灰的還沒收集到，去做料理／開寶箱/商店拿 🎁</p>
    <div id="wardBody"></div>
  </div></div>

  <!-- 拼圖小遊戲 -->
  <div class="sheetwrap hidden" id="puzzWrap"><div class="sheet">
    <div class="grab"></div>
    <div class="lhead"><div class="ltitle">🧩 拼圖遊戲</div><button class="close" onclick="closeSheet('puzzWrap')">✕</button></div>
    <div id="puzzBody"></div>
  </div></div>

  <!-- 🧺 食材袋 -->
  <div class="sheetwrap hidden" id="bagWrap"><div class="sheet">
    <div class="grab"></div>
    <div class="lhead"><div class="ltitle">🧺 食材袋</div><button class="close" onclick="closeSheet('bagWrap')">✕</button></div>
    <p style="font-size:12px;color:#c98ba9;font-weight:700;margin-bottom:8px">在樂園地圖走到食材點（🌾🐔🐄🍓🍫…）採集，做料理時會用到。做菜會消耗、採完隔一下會補貨。</p>
    <div id="bagBody"></div>
  </div></div>

  <div class="toast" id="toast"></div>
</div>

<script src="data/vocab.js"></script>
<script>
/* ====== 收集品：10 個部位 × 每部位10件（共100件）；pos=紙娃娃上的位置 ====== */
const CATDEFS = [
  {type:"band",    label:"🎀 髮圈", pos:"head",  list:[["🎀","蝴蝶結圈"],["⭐","星星圈"],["🌸","花朵圈"],["🍓","草莓圈"],["💛","愛心圈"],["👑","皇冠圈"],["🌈","彩虹圈"],["🩷","粉嫩圈"],["💎","鑽石圈"],["🐰","兔耳圈"]]},
  {type:"clip",    label:"📎 髮夾", pos:"head2", list:[["🎗️","緞帶夾"],["✨","閃亮夾"],["🌷","鬱金香夾"],["🍒","櫻桃夾"],["💧","水滴夾"],["🌙","月亮夾"],["🦋","蝴蝶夾"],["🍀","幸運夾"],["💠","寶石夾"],["🌼","雛菊夾"]]},
  {type:"glasses", label:"👓 眼鏡", pos:"face",  list:[["👓","圓框眼鏡"],["🕶️","太陽眼鏡"],["👓","方框眼鏡"],["👓","愛心框"],["👓","星星框"],["🕶️","貓眼鏡"],["👓","粉框"],["👓","藍框"],["👓","金框"],["🕶️","彩框"]]},
  {type:"necklace",label:"📿 項鏈", pos:"neck",  list:[["📿","珍珠項鏈"],["💛","愛心墜"],["⭐","星星墜"],["🎀","蝴蝶結鏈"],["💎","鑽石項鏈"],["🥇","金鏈"],["🔗","銀鏈"],["💠","寶石鏈"],["🔔","鈴鐺鏈"],["🍀","幸運草鏈"]]},
  {type:"top",     label:"👕 上衣", pos:"torso", list:[["👕","粉T恤"],["👚","甜心上衣"],["👔","小襯衫"],["🎽","運動背心"],["🦺","蓬蓬上衣"],["👘","和風上衣"],["🧶","針織衣"],["🩱","連身衣"],["💗","愛心衣"],["🌈","彩虹上衣"]]},
  {type:"coat",    label:"🧥 外套(法式配飾)", pos:"torso2", list:[["🧥","毛呢外套"],["🧥","風衣"],["👘","法式披肩"],["🥼","罩衫"],["🧥","牛仔外套"],["🧣","斗篷"],["🧥","羽絨外套"],["👔","西裝外套"],["🧶","毛衣外套"],["🌂","雨衣"]]},
  {type:"bottom",  label:"👖 褲裙", pos:"legs",  list:[["👖","牛仔褲"],["🩳","短褲"],["👗","傘裙"],["🩰","澎澎裙"],["🧵","吊帶褲"],["🎀","百褶裙"],["🟦","長裙"],["🟪","格子裙"],["🟩","皮裙"],["🌸","花裙"]]},
  {type:"shoes",   label:"👟 鞋子", pos:"feet",  list:[["👟","運動鞋"],["👞","皮鞋"],["👠","高跟鞋"],["👡","涼鞋"],["👢","靴子"],["🩰","芭蕾鞋"],["👟","帆布鞋"],["🥾","登山鞋"],["🩴","拖鞋"],["👟","樂福鞋"]]},
  {type:"watch",   label:"⌚ 手錶", pos:"wrist", list:[["⌚","粉錶"],["⌚","金錶"],["⌚","銀錶"],["💛","愛心錶"],["⭐","星星錶"],["⌚","運動錶"],["⌚","方錶"],["⌚","圓錶"],["🐱","卡通錶"],["💎","寶石錶"]]},
  {type:"bag",     label:"👜 包包", pos:"side",  list:[["👜","手提包"],["👝","肩背包"],["🎒","後背包"],["🪣","水桶包"],["⛓️","鏈條包"],["👜","托特包"],["👝","斜背包"],["🧳","行李包"],["🧺","草編包"],["👛","晚宴包"]]}
];
const ITEMS = [];
CATDEFS.forEach(c => c.list.forEach((it,i)=> ITEMS.push({id:c.type+(i+1), type:c.type, ic:it[0], name:it[1]})));

/* ===== ☁️ 雲端存檔（換手機不丟）。後端=GAS+試算表，共用三遊戲同帳號 ===== */
var CloudSave=(function(){
  var URL='https://script.google.com/macros/s/AKfycby4rgfkibEbhGuxgggT_Iv1wQt3dcP5J1fHvTbmeQfMLj07kSq2kt27GWAqaTBJb238Og/exec';
  var game='',acct=null,pin=null,name=null,pushTimer=null,LS='cloudAcct';
  function jsonp(params,cb){ var fn='cs_cb_'+Math.floor(Math.random()*1e9);
    window[fn]=function(r){ try{cb(r);}finally{delete window[fn];s.remove();} };
    var qs=Object.keys(params).map(function(k){return k+'='+encodeURIComponent(params[k]);}).join('&');
    var s=document.createElement('script'); s.src=URL+'?'+qs+'&callback='+fn;
    s.onerror=function(){ try{cb({ok:false,msg:'network'});}finally{delete window[fn];s.remove();} };
    document.head.appendChild(s); }
  return {
    init:function(g){ game=g; try{ var v=JSON.parse(localStorage.getItem(LS)||'null'); if(v){acct=v.acct;pin=v.pin;name=v.name;} }catch(e){} },
    account:function(){return acct;}, displayName:function(){return name;},
    login:function(nm,pn,cb){ var a=String(nm||'').trim().toLowerCase();
      jsonp({action:'login',account:a,pin:pn},function(r){ if(r.ok){acct=a;pin=String(pn);name=String(nm).trim(); localStorage.setItem(LS,JSON.stringify({acct:acct,pin:pin,name:name}));} cb(r); }); },
    logout:function(){ acct=pin=name=null; localStorage.removeItem(LS); },
    load:function(cb){ if(!acct){cb(null);return;} jsonp({action:'load',account:acct,pin:pin,game:game},function(r){ cb(r.ok?(r.data||''):null); }); },
    push:function(dataStr){ if(!acct)return; clearTimeout(pushTimer); pushTimer=setTimeout(function(){ try{ fetch(URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({account:acct,pin:pin,game:game,data:dataStr,name:name})}); }catch(e){} },1500); }
  };
})();
CloudSave.init('hellokitty');
function cloudLogin(){
  if(CloudSave.account()){ if(confirm("雲端帳號："+CloudSave.displayName()+"\n要登出這台的雲端連結嗎？(存檔還在雲端)")){ CloudSave.logout(); toast("已登出雲端"); } return; }
  var nm=prompt("雲端存檔・取一個名字（換手機也用這個）："); if(!nm||!nm.trim())return; nm=nm.trim();
  var pn=prompt("設一個密碼（換手機要用同一個，別忘了）："); if(!pn||!pn.trim())return; pn=pn.trim();
  toast("登入中…☁️");
  CloudSave.login(nm,pn,function(res){
    if(!res.ok){ toast(res.msg==='wrong_pin'?"密碼不對，再試一次":"登入失敗，網路再試"); return; }
    CloudSave.load(function(data){
      if(data){ if(confirm("雲端有這個帳號的存檔！\n要把雲端進度下載、覆蓋這台嗎？\n（在新手機第一次請按「確定」）")){ try{ localStorage.setItem("kittySave",data); location.reload(); return; }catch(e){} } else { CloudSave.push(localStorage.getItem("kittySave")); } }
      else { CloudSave.push(localStorage.getItem("kittySave")); }
      toast("雲端存檔已開啟 ☁️");
    });
  });
}
function load(){ try{ const r=JSON.parse(localStorage.getItem("kittySave")); return r?migrate(r):null; }catch(e){ return null; } }
function save(){ localStorage.setItem("kittySave", JSON.stringify(S)); CloudSave.push(localStorage.getItem("kittySave")); }
function migrate(s){ s=s||{};
  if(typeof s.name!=="string") s.name="小公主";
  if(typeof s.coins!=="number") s.coins=0;
  if(typeof s.diamonds!=="number") s.diamonds=0;   // 💎 premium 幣種
  if(typeof s.lastDaily!=="string") s.lastDaily="";   // 每日登入日期(Ⓑ)
  if(typeof s.streak!=="number") s.streak=0;          // 連續登入天數
  if(!s.bag || typeof s.bag!=="object") s.bag={};      // 🧺 食材袋（消耗制）
  if(!Array.isArray(s.wardrobe)) s.wardrobe=[];
  if(!s.equip || typeof s.equip!=="object") s.equip={};
  CATDEFS.forEach(c=>{ if(!(c.type in s.equip)) s.equip[c.type]=null; });   // 10 個部位欄位
  delete s.equip.hair; delete s.equip.dress;                               // 清掉舊欄位
  if(!Array.isArray(s.chests)) s.chests=[];
  return s;
}

/* Ⓑ 每日登入獎勵：每天首次進來 💎+1，連續 7 天當天再 +5 */
function checkDaily(){
  const today=new Date().toISOString().slice(0,10);
  if(S.lastDaily===today) return;
  const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
  S.streak = (S.lastDaily===y) ? (S.streak||0)+1 : 1;
  const bonus = (S.streak%7===0)?5:0, dz=1+bonus;
  S.lastDaily=today; S.diamonds+=dz; save(); render();
  setTimeout(()=>toast("每日登入 💎+"+dz+(bonus?"（連續7天大獎！）":"（連續"+S.streak+"天）")),700);
}

  liveChests.forEach(c=>{ const d=document.createElement("div"); d.className="chest"; d.textContent="🎁"; d.style.left=c.x+"%"; d.style.top=c.y+"%";
    if(c.gold) d.style.filter="drop-shadow(0 0 7px #ffcc00) saturate(1.4)";   // 金色寶箱微微發光
    d.onclick=(e)=>{ e.stopPropagation(); walkTo(c.x,c.y,()=>openChest(c)); }; land.appendChild(d); });
  NPCS.forEach(n=>{ const d=document.createElement("div"); d.className="npc"; d.style.left=n.x+"%"; d.style.top=n.y+"%";
    d.innerHTML=`<div class="bubble">💬</div><div class="ni">${n.ic}</div><div class="nn">${n.name}</div>`;

/* 採集食材進食材袋；採完 45 秒補貨 */
let spotOnCd = new Set();
function collectIngr(fs){
  S.bag[fs.key]=(S.bag[fs.key]||0)+1; save(); render(); speak(INGR[fs.key].en);
  toast("採到 "+INGR[fs.key].ic+INGR[fs.key].zh+"（"+INGR[fs.key].en+"）");
  spotOnCd.add(fs.id); buildLand();
  setTimeout(()=>{ spotOnCd.delete(fs.id); buildLand(); }, 45000);
}
function bagCount(k){ return S.bag[k]||0; }
function bagSummary(){ const ks=Object.keys(S.bag).filter(k=>S.bag[k]>0); return ks.length? ks.map(k=>INGR[k].ic+(S.bag[k]>1?("×"+S.bag[k]):"")).join("  ") : "（空的，去地圖採集食材 🧺）"; }
function walkTo(x,y,then){
  const k=document.getElementById("kitty");
  k.style.left=x+"%"; k.style.top=y+"%";
  if(then) setTimeout(then, 650);
}
function landTap(e){
  if(e.target.closest(".npc,.chest")) return;
  const r=document.getElementById("land").getBoundingClientRect();
  const x=Math.max(6,Math.min(94,(e.clientX-r.left)/r.width*100));
  const y=Math.max(20,Math.min(92,(e.clientY-r.top)/r.height*100));
  walkTo(x,y);
}

/* ====== 朋友任務：做料理（照順序加英文材料→做出東西）→ 獎勵 ====== */
let craftRecipe=null;   // taskNpc 已在上方宣告
function openTask(npc){
  craftRecipe = RECIPES[Math.floor(Math.random()*RECIPES.length)]; taskNpc=npc;
  document.getElementById("taskTitle").textContent = npc.ic+" "+npc.name+"的任務";
  drawTask();
  openSheet("taskWrap");
}
function drawTask(){
  const r=craftRecipe;
  const haveAll = r.need.every(k=>bagCount(k)>0);
  const chips = r.need.map(k=>{ const ok=bagCount(k)>0;
    return `<span class="ingchip ${ok?'ok':'no'}">${INGR[k].ic} ${INGR[k].zh}<small>${INGR[k].en}</small>${ok?' ✓':' ✗'}</span>`; }).join("");
  document.getElementById("craftBody").innerHTML =
    `<div class="ask">${taskNpc.name}想要一個 ${r.ic} <b>${r.en}</b>（${r.zh}）！<br>需要這些食材，沒有的去地圖採集 🧺：</div>
     <div class="ingreq">${chips}</div>
     <button class="btn" id="makeBtn" ${haveAll?'':'disabled style="opacity:.45"'} onclick="makeDish()">${haveAll?('做出 '+r.ic+' '+r.en):'食材不足 · 先去採集'}</button>
     <div class="cttip" style="margin-top:10px">🧺 食材袋：${bagSummary()}</div>`;
}
function makeDish(){
  const r=craftRecipe;
  if(!r.need.every(k=>bagCount(k)>0)){ toast("食材還不夠"); return; }
  r.need.forEach(k=>{ S.bag[k]-=1; if(S.bag[k]<=0) delete S.bag[k]; });   // 消耗食材
  save(); render(); speak(r.en);
  document.getElementById("craftBody").innerHTML =
    `<div style="text-align:center;padding:10px"><div style="font-size:72px">${r.ic}</div>
     <div class="ask">做好 <b>${r.en}</b>（${r.zh}）了！🎉</div></div>`;
  toast("做好 "+r.ic+" "+r.en+"！🎉");
  setTimeout(rewardTask,1000);
}
function rewardTask(){
  if(Math.random()<0.15){ S.diamonds+=1; save(); render(); toast("✨ 特別任務！角色送你 💎+1"); setTimeout(()=>closeSheet("taskWrap"),950); return; }  // Ⓓ 角色特別任務偶爾給鑽石
  const locked=ITEMS.filter(i=>!S.wardrobe.includes(i.id));
  if(locked.length && Math.random()<0.5){
    const it=locked[Math.floor(Math.random()*locked.length)];
    S.wardrobe.push(it.id); save();
    toast("送你 "+it.ic+it.name+" 🎁"); setTimeout(()=>{ closeSheet("taskWrap"); openWard(); },900);
  } else {
    const c=8+Math.floor(Math.random()*8); S.coins+=c; save(); render();
    toast("謝謝你！🪙+"+c); setTimeout(()=>closeSheet("taskWrap"),900);
  }
}

/* ====== 藏寶箱：每 1 分鐘在樂園某處出現一個，走過去開 ====== */
let liveChests=[], chestSeq=0, chestTimer=null;
function spawnChest(){
  if(liveChests.length>=5) return;   // 最多同時 5 個
  liveChests.push({id:"lc"+(++chestSeq), x:12+Math.floor(Math.random()*76), y:52+Math.floor(Math.random()*36), gold:Math.random()<0.14});  // Ⓒ 約14%機率金色寶箱(開出鑽石)
  buildLand(); toast("叮咚～樂園某處出現寶箱了 ✨");
}
function openChest(c){
  liveChests = liveChests.filter(x=>x.id!==c.id);
  if(c.gold){ const dz=1+Math.floor(Math.random()*2); S.diamonds+=dz; save(); buildLand(); render(); toast("✨ 金色寶箱！💎+"+dz); setTimeout(openShop,900); return; }  // Ⓒ 金色寶箱給鑽石
  const locked=ITEMS.filter(i=>!S.wardrobe.includes(i.id));
  if(locked.length){ const it=locked[Math.floor(Math.random()*locked.length)]; S.wardrobe.push(it.id); save(); buildLand(); render();
    toast("打開寶箱！獲得 "+it.ic+it.name+" ✨"); setTimeout(openWard,900); }
  else { const c2=15+Math.floor(Math.random()*15); S.coins+=c2; save(); buildLand(); render(); toast("打開寶箱！🪙+"+c2); }
}

/* 格子視覺：有平面PNG(assets/clothes/{id}.png)就顯示真圖，沒有就退回 emoji */
function tileIC(it){ return `<img src="assets/clothes/${it.id}.png" alt="${it.ic}" onerror="this.replaceWith('${it.ic}')">`; }
/* ====== 商店：買衣服髮飾；已擁有的可「賣回」變金幣 ====== */
const CLOTHING=["top","coat","bottom","shoes"];
/* 💎 鑽石限定道具：只能用鑽石買（id→鑽石價）。這批＝「特別款」收集品；來源待 Kevin 定。清單可調。 */
const GEM_PRICE = { band6:5, band9:8, clip9:5, glasses6:5, necklace5:8, necklace8:6, coat3:8, bottom4:6, shoes6:6, watch10:6, bag10:8 };
function isGem(it){ return it.id in GEM_PRICE; }
function itemCost(it){ return CLOTHING.includes(it.type)?300:200; }   // 金幣價
function sellPrice(it){ return isGem(it)?GEM_PRICE[it.id]:itemCost(it); }   // 賣回＝原價（金幣道具退金幣、鑽石道具退鑽石）
function openShop(){
  document.getElementById("shopCoins").textContent=S.coins;
  document.getElementById("shopDia").textContent=S.diamonds;
  const body=document.getElementById("shopBody"); body.innerHTML="";
  CATDEFS.forEach(cat=>{
    const head=document.createElement("div"); head.className="wcat"; head.textContent=cat.label;
    const g=document.createElement("div"); g.className="wardgrid";
    ITEMS.filter(i=>i.type===cat.type).forEach(it=>{
      const own=S.wardrobe.includes(it.id);
      const d=document.createElement("div"); d.className="witem"+(own?" owned":"");
      d.innerHTML=`<div class="wi">${tileIC(it)}</div><div class="wn">${it.name}</div><div class="wprice">${own?("賣 "+(isGem(it)?"💎":"🪙")+sellPrice(it)):(isGem(it)?("💎 "+GEM_PRICE[it.id]):("🪙 "+itemCost(it)))}</div>`;
      d.onclick=()=> own? sellItem(it) : buyItem(it);
      g.appendChild(d);
    });
    body.appendChild(head); body.appendChild(g);
  });
  openSheet("shopWrap");
}
function buyItem(it){
  if(S.wardrobe.includes(it.id)) return;
  if(isGem(it)){
    const gc=GEM_PRICE[it.id];
    if(S.diamonds<gc){ toast("💎 鑽石不夠（需 💎"+gc+"）"); return; }
    S.diamonds-=gc;
  } else {
    const cost=itemCost(it);
    if(S.coins<cost){ toast("金幣不夠（需 🪙"+cost+"）去做料理賺"); return; }
    S.coins-=cost;
  }
  S.wardrobe.push(it.id); save(); render(); openShop();
  toast("買到 "+it.ic+it.name+" 🎉");
}
function sellItem(it){
  if(!S.wardrobe.includes(it.id)) return;
  const cur=isGem(it)?"💎":"🪙";
  if(!confirm("要把「"+it.name+"」賣掉換 "+cur+sellPrice(it)+" 嗎？")) return;
  S.wardrobe=S.wardrobe.filter(x=>x!==it.id);
  if(S.equip[it.type]===it.id) S.equip[it.type]=null;   // 賣掉就脫下
  if(isGem(it)) S.diamonds+=sellPrice(it); else S.coins+=sellPrice(it);
  save(); render(); openShop();
  toast("賣掉 "+it.ic+it.name+"，"+cur+"+"+sellPrice(it));
}

/* ====== 衣櫃換裝：上衣/褲子/髮圈/髮夾 各10種 ====== */
function openWard(){
  buildDoll(document.getElementById("dollPreview"));
  const body=document.getElementById("wardBody"); body.innerHTML="";
  CATDEFS.forEach(cat=>{
    const owned=ITEMS.filter(i=>i.type===cat.type&&S.wardrobe.includes(i.id)).length;
    const head=document.createElement("div"); head.className="wcat"; head.textContent=`${cat.label}（${owned}/10）`;
    const g=document.createElement("div"); g.className="wardgrid";
    ITEMS.filter(i=>i.type===cat.type).forEach(it=>{
      const own=S.wardrobe.includes(it.id), on=S.equip[cat.type]===it.id;
      const d=document.createElement("div"); d.className="witem"+(own?"":" locked")+(on?" on":"");
      d.innerHTML=`<div class="wi">${own?tileIC(it):it.ic}</div><div class="wn">${own?it.name:"？？？"}</div>`;
      if(own) d.onclick=()=>{ S.equip[cat.type]=on?null:it.id; save(); render(); openWard(); };
      g.appendChild(d);
    });
    body.appendChild(head); body.appendChild(g);
  });
  openSheet("wardWrap");
}

/* ====== 🧺 食材袋檢視 ====== */
function openBag(){
  const body=document.getElementById("bagBody");
  body.innerHTML = `<div class="wardgrid">`+ Object.keys(INGR).map(k=>{ const n=bagCount(k);
    return `<div class="witem${n?'':' locked'}"><div class="wi">${INGR[k].ic}</div><div class="wn">${INGR[k].zh}<br><small style="color:#c98ba9">${INGR[k].en}</small></div><div class="wprice">×${n}</div></div>`; }).join("") +`</div>`;
  openSheet("bagWrap");
}
/* ====== 拼圖小遊戲：2×2(簡單) / 3×3(中) / 4×4(難)，滑動排回 1→N ====== */
let pz={n:3,tiles:[],empty:0};
function openPuzzle(){
  document.getElementById("puzzBody").innerHTML=`
    <p style="text-align:center;font-size:13px;color:#c98ba9;font-weight:700;margin-bottom:4px">選難度 → 點數字滑到空格，排回 1→N。越難賺越多 🪙</p>
    <div class="pdiff">
      <button onclick="startPuzzle(2)">簡單 2×2 · 🪙10</button>
      <button onclick="startPuzzle(3)">中等 3×3 · 🪙25</button>
      <button onclick="startPuzzle(4)">困難 4×4 · 🪙50</button>
    </div>
    <div id="pgridWrap"></div>
    <div class="pmsg" id="pmsg">選一個難度開始 🧩</div>`;
  openSheet("puzzWrap");
}
function pNeighbors(idx,n){ const r=Math.floor(idx/n),c=idx%n,o=[]; if(r>0)o.push(idx-n); if(r<n-1)o.push(idx+n); if(c>0)o.push(idx-1); if(c<n-1)o.push(idx+1); return o; }
function startPuzzle(n){
  pz.n=n; const t=[]; for(let i=1;i<n*n;i++)t.push(i); t.push(0); pz.tiles=t; pz.empty=n*n-1;
  let guard=0;
  do{ for(let k=0;k<n*n*25;k++){ const nb=pNeighbors(pz.empty,n); pSlide(nb[Math.floor(Math.random()*nb.length)],true); } }while(pSolved()&&guard++<5);
  renderPuzzle();
  document.getElementById("pmsg").textContent="加油！排回 1→"+(n*n-1);
}
function pSlide(idx,silent){
  if(!pNeighbors(pz.empty,pz.n).includes(idx)) return;
  pz.tiles[pz.empty]=pz.tiles[idx]; pz.tiles[idx]=0; pz.empty=idx;
  if(!silent){ if(pSolved()){ renderPuzzle(); puzzleWin(); } else renderPuzzle(); }
}
function pSolved(){ for(let i=0;i<pz.n*pz.n-1;i++) if(pz.tiles[i]!==i+1) return false; return true; }
function renderPuzzle(){
  const n=pz.n, size=Math.min(304, 72*n);
  const wrap=document.getElementById("pgridWrap");
  wrap.innerHTML=`<div class="pgrid" style="grid-template-columns:repeat(${n},1fr);width:${size}px;height:${size}px"></div>`;
  const g=wrap.firstChild;
  pz.tiles.forEach((v,i)=>{ const b=document.createElement("button"); b.className="ptile"+(v===0?" empty":"");
    b.textContent=v===0?"":v; b.style.fontSize=(n<=2?34:n===3?26:20)+"px";
    if(v!==0) b.onclick=()=>pSlide(i,false); g.appendChild(b); });
}
function puzzleWin(){
  const reward=pz.n===2?10:pz.n===3?25:50; S.coins+=reward;
  let dmsg=""; if(pz.n===4){ S.diamonds+=1; dmsg="＋💎1"; }   // Ⓒ 4×4 困難拼圖額外給鑽石
  save(); render();
  document.getElementById("pmsg").textContent="🎉 拼好了！🪙+"+reward+dmsg; toast("拼圖完成！🪙+"+reward+(dmsg?"，💎+1":""));
}

function openSheet(id){ document.getElementById(id).classList.remove("hidden"); }
function closeSheet(id){ document.getElementById(id).classList.add("hidden"); }
function speak(t){ if(!t||!window.speechSynthesis) return; const u=new SpeechSynthesisUtterance(t); u.lang="en-US"; u.rate=.85; speechSynthesis.cancel(); speechSynthesis.speak(u); }
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1000); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

if(S){ document.getElementById("nameInput").value=S.name||""; }
</script>
