<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kitty樂園">
<meta name="theme-color" content="#ffd6e7">
<title>Hello Kitty 樂園 · 學英文換裝闖關</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}
  html,body{height:100%;}
  body{background:#ffe6f0;color:#7a3a55;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .app{width:100%;max-width:520px;height:100%;max-height:940px;display:flex;flex-direction:column;position:relative;overflow:hidden;}
  .hidden{display:none!important;}
  .btn{background:#ff8fb8;color:#fff;font-weight:900;border:none;border-radius:16px;padding:15px;font-size:21px;cursor:pointer;box-shadow:0 6px 0 #e06a97;transition:.05s;width:100%;}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #e06a97;}

  /* login */
  #login{margin:auto;text-align:center;padding:26px;}
  #login .logo{font-size:88px;margin-bottom:6px;}
  #login h1{font-size:30px;font-weight:900;margin-bottom:8px;color:#e0568e;}
  #login p{font-size:15px;opacity:.85;margin-bottom:24px;}
  #login input{width:100%;font-size:22px;padding:14px 18px;border:none;border-radius:16px;text-align:center;color:#7a3a55;font-weight:700;margin-bottom:14px;box-shadow:0 3px 10px rgba(224,86,142,.18);}

  #game{height:100%;display:flex;flex-direction:column;}
  .hud{display:flex;align-items:center;gap:8px;padding:12px 14px 6px;}
  .hud .coin{background:#fff;border-radius:999px;padding:6px 14px;font-weight:900;font-size:16px;color:#e0568e;box-shadow:0 2px 8px rgba(224,86,142,.15);}
  .hud .who{flex:1;text-align:center;font-weight:900;font-size:15px;color:#c94f86;}
  .hud .wbtn{background:#fff;border:none;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:900;color:#e0568e;cursor:pointer;box-shadow:0 2px 8px rgba(224,86,142,.15);}
  .hint{text-align:center;font-size:12px;color:#c98ba9;font-weight:700;padding:0 14px 4px;}

  /* 陸地地圖 */
  .land{flex:1;margin:6px 14px;border-radius:26px;position:relative;overflow:hidden;
    background:linear-gradient(180deg,#bfe9ff 0%,#dff5ff 40%,#cdeeb0 55%,#a9e08c 100%);
    box-shadow:inset 0 2px 0 #fff,0 6px 18px rgba(224,120,160,.2);cursor:pointer;}
  .land .sun{position:absolute;top:16px;right:20px;width:42px;height:42px;border-radius:50%;background:radial-gradient(circle,#fff3b0,#ffd54a);box-shadow:0 0 24px #ffe58a;}
  .prop{position:absolute;font-size:44px;transform:translate(-50%,-50%);filter:drop-shadow(0 3px 3px rgba(60,90,60,.2));pointer-events:none;}
  .npc{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:pointer;z-index:3;}
  .npc .ni{font-size:52px;line-height:1;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 5px 4px rgba(120,60,90,.25));}
  .npc .nn{font-size:11px;font-weight:900;color:#a34b76;background:rgba(255,255,255,.8);border-radius:999px;padding:1px 7px;margin-top:2px;}
  .npc .bubble{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:16px;}
  .chest{position:absolute;transform:translate(-50%,-50%);font-size:34px;cursor:pointer;z-index:2;filter:drop-shadow(0 3px 3px rgba(60,60,20,.3));}
  .chest.opened{opacity:.4;}
  /* Hello Kitty 玩家 */
  .kitty{position:absolute;transform:translate(-50%,-100%);z-index:5;transition:left .6s ease,top .6s ease;text-align:center;pointer-events:none;}
  .kitty .ksh{width:44px;height:10px;margin:2px auto 0;background:rgba(60,110,60,.22);border-radius:50%;filter:blur(2px);}
  /* ===== 紙娃娃：白身體+貓頭，衣服一層層平面套上去（可換成平面PNG） ===== */
  .doll{position:relative;width:130px;height:190px;margin:0 auto;}
  .doll .dbody{position:absolute;top:56px;left:50%;transform:translateX(-50%);width:62px;height:74px;background:#fff;border:2px solid #f2cad9;border-radius:26px 26px 14px 14px;}
  .doll .dlegL,.doll .dlegR{position:absolute;top:126px;width:20px;height:50px;background:#fff;border:2px solid #f2cad9;border-radius:10px 10px 12px 12px;}
  .doll .dlegL{left:41px} .doll .dlegR{right:41px}
  .doll .dhead{position:absolute;top:-2px;left:50%;transform:translateX(-50%);font-size:58px;line-height:1;}
  .doll .dl{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;line-height:1;}
  .doll .dl img{object-fit:contain;}
  .doll .p-head{top:-10px;font-size:24px;}
  .doll .p-head2{top:4px;left:64%;font-size:22px;}
  .doll .p-face{top:24px;font-size:22px;}
  .doll .p-neck{top:48px;font-size:18px;}
  .doll .p-torso{top:58px;font-size:40px;} .doll .p-torso img{max-width:66px;max-height:80px;}
  .doll .p-torso2{top:54px;font-size:46px;} .doll .p-torso2 img{max-width:72px;max-height:88px;}
  .doll .p-legs{top:122px;font-size:34px;} .doll .p-legs img{max-width:60px;max-height:60px;}
  .doll .p-feet{top:170px;font-size:22px;}
  .doll .p-wrist{top:96px;left:74%;font-size:16px;}
  .doll .p-side{top:84px;left:22%;font-size:24px;}
  .kitty .dollmini{transform:scale(.52);transform-origin:bottom center;}

  /* bottom sheet */
  .sheetwrap{position:absolute;inset:0;background:rgba(90,40,70,.35);display:flex;align-items:flex-end;z-index:20;}
  .sheet{background:#fff;width:100%;max-height:86%;border-radius:24px 24px 0 0;padding:12px 16px 18px;display:flex;flex-direction:column;box-shadow:0 -6px 24px rgba(120,60,90,.25);animation:up .25s ease;overflow:auto;}
  @keyframes up{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .grab{width:44px;height:5px;background:#f0d5e2;border-radius:999px;margin:2px auto 10px;flex:none;}
  .lhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .ltitle{font-weight:900;font-size:17px;flex:1;color:#c94f86;}
  .close{background:#ffe6f0;border:none;border-radius:999px;width:34px;height:34px;font-size:18px;cursor:pointer;color:#c94f86;}
  .ask{font-size:14px;color:#c98ba9;text-align:center;font-weight:700;}
  .zh{font-size:40px;font-weight:900;text-align:center;margin:6px 0 2px;color:#a34b76;}
  .speak{display:block;margin:2px auto 12px;background:#ffe6f0;color:#e0568e;border:none;border-radius:999px;padding:8px 18px;font-size:15px;font-weight:800;cursor:pointer;}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
  .opt{background:#fff5fa;color:#7a3a55;border:2px solid #ffd6e7;border-radius:14px;padding:18px 6px;font-size:22px;font-weight:900;cursor:pointer;}
  .opt:active{transform:scale(.97);}
  .opt.right{background:#5ccf8a;border-color:#3bb56e;color:#fff;}
  .opt.wrong{background:#ff6b8a;border-color:#e6476b;color:#fff;}
  .craftbtn{padding:10px 4px;line-height:1.2;}
  .craftmade{min-height:70px;background:#fff5fa;border:2px dashed #ffd6e7;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:40px;margin:6px 0;}
  .craftmade .mstep{font-size:36px;}
  .cttip{text-align:center;font-size:15px;font-weight:800;color:#c94f86;margin:6px 0 10px;}

  /* 衣櫃 */
  .wardgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .witem{border:2px solid #ffe0ec;border-radius:14px;padding:12px 4px;text-align:center;cursor:pointer;background:#fff8fb;}
  .witem.locked{opacity:.4;}
  .witem.on{border-color:#ff8fb8;background:#ffe6f0;}
  .witem .wi{font-size:34px;} .witem .wn{font-size:11px;font-weight:800;color:#a34b76;margin-top:3px;}
  .wcat{font-weight:900;font-size:13px;color:#c94f86;margin:12px 0 6px;}
  .wcat:first-child{margin-top:2px;}
  .witem.owned{opacity:.55;} .witem .wprice{font-size:11px;font-weight:900;color:#e0568e;margin-top:2px;}

  .toast{position:fixed;top:32%;left:50%;transform:translate(-50%,-50%) scale(0);background:rgba(90,30,60,.9);color:#fff;padding:18px 28px;border-radius:18px;font-size:22px;font-weight:900;transition:transform .18s;z-index:40;text-align:center;max-width:82%;}
  .toast.show{transform:translate(-50%,-50%) scale(1);}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
</style>
</head>
<body>
<div class="app">

  <div id="login">
    <div class="logo">🎀</div>
    <h1>Hello Kitty 樂園</h1>
    <p>在樂園裡走走、找寶箱、幫朋友答題，收集可愛衣服髮飾！</p>
    <input id="nameInput" maxlength="8" placeholder="輸入你的名字">
    <button class="btn" onclick="start()">進入樂園 →</button>
  </div>

  <div id="game" class="hidden">
    <div class="hud">
      <div class="coin">🪙 <span id="coins">0</span></div>
      <div class="who"><span id="who">Kitty 樂園</span></div>
      <button class="wbtn" onclick="openShop()">🛒 商店</button>
      <button class="wbtn" onclick="openWard()">👗 衣櫃</button>
    </div>
    <div class="hint">點地面讓 Kitty 走過去 · 點朋友做料理 · 每分鐘有寶箱出現、走過去找 🎁</div>

    <div class="land" id="land" onclick="landTap(event)">
      <div class="sun"></div>
      <!-- props / npcs / chest / kitty 由 JS 佈置 -->
      <div class="kitty" id="kitty" style="left:50%;top:78%;">
        <div class="doll dollmini" id="kittyDoll"></div>
        <div class="ksh"></div>
      </div>
    </div>
  </div>

  <!-- 做料理任務 -->
  <div class="sheetwrap hidden" id="taskWrap"><div class="sheet">
    <div class="grab"></div>
    <div class="lhead"><div class="ltitle" id="taskTitle">🐰 做料理</div><button class="close" onclick="closeSheet('taskWrap')">✕</button></div>
    <div id="craftBody"></div>
  </div></div>

  <!-- 商店：用金幣買衣服髮飾 -->
  <div class="sheetwrap hidden" id="shopWrap"><div class="sheet">
    <div class="grab"></div>
    <div class="lhead"><div class="ltitle">🛒 商店（🪙 <span id="shopCoins">0</span>）</div><button class="close" onclick="closeSheet('shopWrap')">✕</button></div>
    <p style="font-size:12px;color:#c98ba9;font-weight:700;margin-bottom:8px;">用金幣買想要的衣服髮飾（買了直接進衣櫃）。金幣去做料理／開寶箱賺 🪙</p>
    <div id="shopBody"></div>
  </div></div>

  <!-- 衣櫃換裝 -->
  <div class="sheetwrap hidden" id="wardWrap"><div class="sheet">
    <div class="grab"></div>
    <div class="lhead"><div class="ltitle">👗 Kitty 的衣櫃</div><button class="close" onclick="closeSheet('wardWrap')">✕</button></div>
    <div class="doll" id="dollPreview" style="margin:0 auto 6px"></div>
    <p style="font-size:12px;color:#c98ba9;font-weight:700;margin-bottom:8px;text-align:center">點一下換上（再點一下脫掉）→ 娃娃立刻穿上。灰的還沒收集到，去做料理／開寶箱/商店拿 🎁</p>
    <div id="wardBody"></div>
  </div></div>

  <div class="toast" id="toast"></div>
</div>

<script src="data/vocab.js"></script>
<script>
/* ====== 收集品：10 個部位 × 每部位10件（共100件）；pos=紙娃娃上的位置 ====== */
const CATDEFS = [
  {type:"band",    label:"🎀 髮圈", pos:"head",  list:[["🎀","蝴蝶結圈"],["⭐","星星圈"],["🌸","花朵圈"],["🍓","草莓圈"],["💛","愛心圈"],["👑","皇冠圈"],["🌈","彩虹圈"],["🩷","粉嫩圈"],["💎","鑽石圈"],["🐰","兔耳圈"]]},
  {type:"clip",    label:"📎 髮夾", pos:"head2", list:[["🎗️","緞帶夾"],["✨","閃亮夾"],["🌷","鬱金香夾"],["🍒","櫻桃夾"],["💧","水滴夾"],["🌙","月亮夾"],["🦋","蝴蝶夾"],["🍀","幸運夾"],["💠","寶石夾"],["🌼","雛菊夾"]]},
  {type:"glasses", label:"👓 眼鏡", pos:"face",  list:[["👓","圓框眼鏡"],["🕶️","太陽眼鏡"],["👓","方框眼鏡"],["👓","愛心框"],["👓","星星框"],["🕶️","貓眼鏡"],["👓","粉框"],["👓","藍框"],["👓","金框"],["🕶️","彩框"]]},
  {type:"necklace",label:"📿 項鏈", pos:"neck",  list:[["📿","珍珠項鏈"],["💛","愛心墜"],["⭐","星星墜"],["🎀","蝴蝶結鏈"],["💎","鑽石項鏈"],["🥇","金鏈"],["🔗","銀鏈"],["💠","寶石鏈"],["🔔","鈴鐺鏈"],["🍀","幸運草鏈"]]},
  {type:"top",     label:"👕 上衣", pos:"torso", list:[["👕","粉T恤"],["👚","甜心上衣"],["👔","小襯衫"],["🎽","運動背心"],["🦺","蓬蓬上衣"],["👘","和風上衣"],["🧶","針織衣"],["🩱","連身衣"],["💗","愛心衣"],["🌈","彩虹上衣"]]},
  {type:"coat",    label:"🧥 外套(法式配飾)", pos:"torso2", list:[["🧥","毛呢外套"],["🧥","風衣"],["👘","法式披肩"],["🥼","罩衫"],["🧥","牛仔外套"],["🧣","斗篷"],["🧥","羽絨外套"],["👔","西裝外套"],["🧶","毛衣外套"],["🌂","雨衣"]]},
  {type:"bottom",  label:"👖 褲裙", pos:"legs",  list:[["👖","牛仔褲"],["🩳","短褲"],["👗","傘裙"],["🩰","澎澎裙"],["🧵","吊帶褲"],["🎀","百褶裙"],["🟦","長裙"],["🟪","格子裙"],["🟩","皮裙"],["🌸","花裙"]]},
  {type:"shoes",   label:"👟 鞋子", pos:"feet",  list:[["👟","運動鞋"],["👞","皮鞋"],["👠","高跟鞋"],["👡","涼鞋"],["👢","靴子"],["🩰","芭蕾鞋"],["👟","帆布鞋"],["🥾","登山鞋"],["🩴","拖鞋"],["👟","樂福鞋"]]},
  {type:"watch",   label:"⌚ 手錶", pos:"wrist", list:[["⌚","粉錶"],["⌚","金錶"],["⌚","銀錶"],["💛","愛心錶"],["⭐","星星錶"],["⌚","運動錶"],["⌚","方錶"],["⌚","圓錶"],["🐱","卡通錶"],["💎","寶石錶"]]},
  {type:"bag",     label:"👜 包包", pos:"side",  list:[["👜","手提包"],["👝","肩背包"],["🎒","後背包"],["🪣","水桶包"],["⛓️","鏈條包"],["👜","托特包"],["👝","斜背包"],["🧳","行李包"],["🧺","草編包"],["👛","晚宴包"]]}
];
const ITEMS = [];
CATDEFS.forEach(c => c.list.forEach((it,i)=> ITEMS.push({id:c.type+(i+1), type:c.type, ic:it[0], name:it[1]})));
/* ====== 地圖佈置：朋友、道具遮蔽物、藏起來的寶箱 ====== */
const NPCS = [
  {id:"melody", ic:"🐰", name:"美樂蒂", x:24, y:40},
  {id:"kuromi", ic:"😈", name:"庫洛米", x:76, y:34}
];
const PROPS = [ // 裝飾物（也用來「半遮住」寶箱）
  {ic:"🌳", x:82, y:64}, {ic:"🌳", x:14, y:66}, {ic:"🌸", x:40, y:74},
  {ic:"🌷", x:60, y:70}, {ic:"🏡", x:50, y:30}, {ic:"🌲", x:88, y:82}
];
const CHESTS = [ // 藏起來、不太明顯（躲在右下角的樹叢後）
  {id:"c1", x:85, y:70},   // 藏在 🌳(82,64) 附近
  {id:"c2", x:12, y:80}    // 藏在左下角
];
/* ====== 做料理：朋友給任務，照順序加材料做出東西（材料是英文＝順便學單字） ====== */
const RECIPES = [
  {ic:"🍞", en:"bread",  zh:"麵包", steps:[{ic:"🌾",en:"flour",zh:"麵粉"},{ic:"🥚",en:"egg",zh:"蛋"},{ic:"🧈",en:"butter",zh:"奶油"},{ic:"🔥",en:"bake",zh:"烤"}]},
  {ic:"🍰", en:"cake",   zh:"蛋糕", steps:[{ic:"🌾",en:"flour",zh:"麵粉"},{ic:"🥚",en:"egg",zh:"蛋"},{ic:"🍓",en:"strawberry",zh:"草莓"},{ic:"🍶",en:"milk",zh:"牛奶"}]},
  {ic:"🍪", en:"cookie", zh:"餅乾", steps:[{ic:"🌾",en:"flour",zh:"麵粉"},{ic:"🍫",en:"chocolate",zh:"巧克力"},{ic:"🧈",en:"butter",zh:"奶油"},{ic:"🔥",en:"bake",zh:"烤"}]},
  {ic:"🧃", en:"juice",  zh:"果汁", steps:[{ic:"🍎",en:"apple",zh:"蘋果"},{ic:"🍊",en:"orange",zh:"橘子"},{ic:"🧊",en:"ice",zh:"冰塊"}]},
  {ic:"🍵", en:"tea",    zh:"茶",   steps:[{ic:"🍃",en:"tea",zh:"茶葉"},{ic:"💧",en:"water",zh:"水"},{ic:"🍯",en:"honey",zh:"蜂蜜"}]},
  {ic:"🍦", en:"ice cream", zh:"冰淇淋", steps:[{ic:"🍶",en:"milk",zh:"牛奶"},{ic:"🍓",en:"strawberry",zh:"草莓"},{ic:"🧊",en:"ice",zh:"冰塊"}]},
  {ic:"🍩", en:"donut",    zh:"甜甜圈", steps:[{ic:"🌾",en:"flour",zh:"麵粉"},{ic:"🍫",en:"chocolate",zh:"巧克力"},{ic:"🍬",en:"sugar",zh:"糖"}]},
  {ic:"🍮", en:"pudding",  zh:"布丁",   steps:[{ic:"🥚",en:"egg",zh:"蛋"},{ic:"🍶",en:"milk",zh:"牛奶"},{ic:"🍬",en:"sugar",zh:"糖"}]},
  {ic:"🧁", en:"cupcake",  zh:"杯子蛋糕", steps:[{ic:"🌾",en:"flour",zh:"麵粉"},{ic:"🥚",en:"egg",zh:"蛋"},{ic:"🍓",en:"strawberry",zh:"草莓"},{ic:"🔥",en:"bake",zh:"烤"}]},
  {ic:"🥞", en:"pancake",  zh:"鬆餅",   steps:[{ic:"🌾",en:"flour",zh:"麵粉"},{ic:"🥚",en:"egg",zh:"蛋"},{ic:"🍯",en:"honey",zh:"蜂蜜"}]},
  {ic:"🍭", en:"lollipop", zh:"棒棒糖", steps:[{ic:"🍬",en:"sugar",zh:"糖"},{ic:"🍓",en:"strawberry",zh:"草莓"},{ic:"🌈",en:"color",zh:"顏色"}]},
  {ic:"🍫", en:"chocolate",zh:"巧克力", steps:[{ic:"🍫",en:"cocoa",zh:"可可"},{ic:"🍶",en:"milk",zh:"牛奶"},{ic:"🍬",en:"sugar",zh:"糖"}]}
];

let S = load(), taskCur=null, taskNpc=null;
function load(){ try{ const r=JSON.parse(localStorage.getItem("kittySave")); return r?migrate(r):null; }catch(e){ return null; } }
function save(){ localStorage.setItem("kittySave", JSON.stringify(S)); }
function migrate(s){ s=s||{};
  if(typeof s.name!=="string") s.name="小公主";
  if(typeof s.coins!=="number") s.coins=0;
  if(!Array.isArray(s.wardrobe)) s.wardrobe=[];
  if(!s.equip || typeof s.equip!=="object") s.equip={};
  CATDEFS.forEach(c=>{ if(!(c.type in s.equip)) s.equip[c.type]=null; });   // 10 個部位欄位
  delete s.equip.hair; delete s.equip.dress;                               // 清掉舊欄位
  if(!Array.isArray(s.chests)) s.chests=[];
  return s;
}
function start(){
  const n=document.getElementById("nameInput").value.trim()||"小公主";
  if(!S) S=migrate({name:n}); else S.name=n; save();
  words = getWords([1,2,3]);
  document.getElementById("login").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  buildLand(); render();
  if(chestTimer) clearInterval(chestTimer); chestTimer=setInterval(spawnChest, 60000);  // 每 1 分鐘出現寶箱
}
let words=[];
/* 紙娃娃：白身體+貓頭 + 各部位一層層套上（有平面PNG就用，否則emoji） */
function dollLayerHTML(cat){
  const id=S.equip[cat.type]; if(!id) return ""; const it=ITEMS.find(i=>i.id===id); if(!it) return "";
  return `<div class="dl p-${cat.pos}"><img src="assets/clothes/${it.id}.png" alt="" onerror="this.parentNode.textContent='${it.ic}'"></div>`;
}
function buildDoll(el){
  if(!el) return;
  el.innerHTML = `<div class="dbody"></div><div class="dlegL"></div><div class="dlegR"></div><div class="dhead">🐱</div>` + CATDEFS.map(dollLayerHTML).join("");
}
function render(){
  document.getElementById("coins").textContent=S.coins;
  document.getElementById("who").textContent=S.name+" 的樂園";
  buildDoll(document.getElementById("kittyDoll"));
}
function buildLand(){
  const land=document.getElementById("land");
  // 清掉舊的（保留 sun 和 kitty）
  [...land.querySelectorAll(".prop,.npc,.chest")].forEach(e=>e.remove());
  PROPS.forEach(p=>{ const d=document.createElement("div"); d.className="prop"; d.textContent=p.ic; d.style.left=p.x+"%"; d.style.top=p.y+"%"; land.appendChild(d); });
  liveChests.forEach(c=>{ const d=document.createElement("div"); d.className="chest"; d.textContent="🎁"; d.style.left=c.x+"%"; d.style.top=c.y+"%";
    d.onclick=(e)=>{ e.stopPropagation(); walkTo(c.x,c.y,()=>openChest(c)); }; land.appendChild(d); });
  NPCS.forEach(n=>{ const d=document.createElement("div"); d.className="npc"; d.style.left=n.x+"%"; d.style.top=n.y+"%";
    d.innerHTML=`<div class="bubble">💬</div><div class="ni">${n.ic}</div><div class="nn">${n.name}</div>`;
    d.onclick=(e)=>{ e.stopPropagation(); walkTo(n.x,n.y+8,()=>openTask(n)); }; land.appendChild(d); });
}
function walkTo(x,y,then){
  const k=document.getElementById("kitty");
  k.style.left=x+"%"; k.style.top=y+"%";
  if(then) setTimeout(then, 650);
}
function landTap(e){
  if(e.target.closest(".npc,.chest")) return;
  const r=document.getElementById("land").getBoundingClientRect();
  const x=Math.max(6,Math.min(94,(e.clientX-r.left)/r.width*100));
  const y=Math.max(20,Math.min(92,(e.clientY-r.top)/r.height*100));
  walkTo(x,y);
}

/* ====== 朋友任務：做料理（照順序加英文材料→做出東西）→ 獎勵 ====== */
let craftRecipe=null, craftAdded=0;
function openTask(npc){
  craftRecipe = RECIPES[Math.floor(Math.random()*RECIPES.length)]; craftAdded=0;
  const r=craftRecipe;
  document.getElementById("taskTitle").textContent = npc.ic+" "+npc.name+"的任務";
  document.getElementById("craftBody").innerHTML =
    `<div class="ask">${npc.name}想要一個 ${r.ic} <b>${r.en}</b>（${r.zh}）！<br>照順序點材料，一起做出來 →</div>
     <div class="craftmade" id="craftMade">…</div>
     <div class="cttip" id="ctTip"></div>
     <div class="opts" id="craftSteps"></div>`;
  drawCraft();
  openSheet("taskWrap");
}
function drawCraft(){
  const r=craftRecipe;
  document.getElementById("craftMade").innerHTML = craftAdded? r.steps.slice(0,craftAdded).map(s=>`<span class="mstep">${s.ic}</span>`).join("") : "…";
  const tip=document.getElementById("ctTip");
  tip.innerHTML = craftAdded<r.steps.length ? `下一步：加 <b>${r.steps[craftAdded].en}</b>（${r.steps[craftAdded].zh}）` : "完成！";
  const box=document.getElementById("craftSteps"); box.innerHTML="";
  shuffle(r.steps.slice()).forEach(s=>{
    const b=document.createElement("button"); b.className="opt craftbtn";
    b.innerHTML=`<div style="font-size:30px">${s.ic}</div><div style="font-size:14px">${s.en}</div><div style="font-size:11px;color:#c98ba9">${s.zh}</div>`;
    b.onclick=()=>{ speak(s.en);
      if(s.en===r.steps[craftAdded].en){ craftAdded++; if(craftAdded>=r.steps.length) finishCraft(); else drawCraft(); }
      else toast("先加「"+r.steps[craftAdded].zh+"」喔"); };
    box.appendChild(b);
  });
}
function finishCraft(){
  const r=craftRecipe;
  document.getElementById("craftMade").innerHTML=`<span style="font-size:60px">${r.ic}</span>`;
  document.getElementById("ctTip").innerHTML=`做好 <b>${r.en}</b>（${r.zh}）了！🎉`;
  document.getElementById("craftSteps").innerHTML="";
  speak(r.en); toast("做好 "+r.ic+" "+r.en+"！🎉");
  setTimeout(rewardTask,1000);
}
function rewardTask(){
  const locked=ITEMS.filter(i=>!S.wardrobe.includes(i.id));
  if(locked.length && Math.random()<0.5){
    const it=locked[Math.floor(Math.random()*locked.length)];
    S.wardrobe.push(it.id); save();
    toast("送你 "+it.ic+it.name+" 🎁"); setTimeout(()=>{ closeSheet("taskWrap"); openWard(); },900);
  } else {
    const c=8+Math.floor(Math.random()*8); S.coins+=c; save(); render();
    toast("謝謝你！🪙+"+c); setTimeout(()=>closeSheet("taskWrap"),900);
  }
}

/* ====== 藏寶箱：每 1 分鐘在樂園某處出現一個，走過去開 ====== */
let liveChests=[], chestSeq=0, chestTimer=null;
function spawnChest(){
  if(liveChests.length>=5) return;   // 最多同時 5 個
  liveChests.push({id:"lc"+(++chestSeq), x:12+Math.floor(Math.random()*76), y:52+Math.floor(Math.random()*36)});
  buildLand(); toast("叮咚～樂園某處出現寶箱了 ✨");
}
function openChest(c){
  liveChests = liveChests.filter(x=>x.id!==c.id);
  const locked=ITEMS.filter(i=>!S.wardrobe.includes(i.id));
  if(locked.length){ const it=locked[Math.floor(Math.random()*locked.length)]; S.wardrobe.push(it.id); save(); buildLand(); render();
    toast("打開寶箱！獲得 "+it.ic+it.name+" ✨"); setTimeout(openWard,900); }
  else { const c2=15+Math.floor(Math.random()*15); S.coins+=c2; save(); buildLand(); render(); toast("打開寶箱！🪙+"+c2); }
}

/* ====== 商店：買衣服髮飾；已擁有的可「賣回」變金幣 ====== */
const CLOTHING=["top","coat","bottom","shoes"];
function itemCost(it){ return CLOTHING.includes(it.type)?30:20; }
function sellPrice(it){ return itemCost(it); }   // 賣回＝原價（買賣不虧、只是換回金幣）
function openShop(){
  document.getElementById("shopCoins").textContent=S.coins;
  const body=document.getElementById("shopBody"); body.innerHTML="";
  CATDEFS.forEach(cat=>{
    const head=document.createElement("div"); head.className="wcat"; head.textContent=cat.label;
    const g=document.createElement("div"); g.className="wardgrid";
    ITEMS.filter(i=>i.type===cat.type).forEach(it=>{
      const own=S.wardrobe.includes(it.id);
      const d=document.createElement("div"); d.className="witem"+(own?" owned":"");
      d.innerHTML=`<div class="wi">${it.ic}</div><div class="wn">${it.name}</div><div class="wprice">${own?("賣 🪙"+sellPrice(it)):("🪙 "+itemCost(it))}</div>`;
      d.onclick=()=> own? sellItem(it) : buyItem(it);
      g.appendChild(d);
    });
    body.appendChild(head); body.appendChild(g);
  });
  openSheet("shopWrap");
}
function buyItem(it){
  if(S.wardrobe.includes(it.id)) return;
  const cost=itemCost(it);
  if(S.coins<cost){ toast("金幣不夠（需 🪙"+cost+"）去做料理賺"); return; }
  S.coins-=cost; S.wardrobe.push(it.id); save(); render(); openShop();
  toast("買到 "+it.ic+it.name+" 🎉");
}
function sellItem(it){
  if(!S.wardrobe.includes(it.id)) return;
  if(!confirm("要把「"+it.name+"」賣掉換 🪙"+sellPrice(it)+" 嗎？")) return;
  S.wardrobe=S.wardrobe.filter(x=>x!==it.id);
  if(S.equip[it.type]===it.id) S.equip[it.type]=null;   // 賣掉就脫下
  S.coins+=sellPrice(it); save(); render(); openShop();
  toast("賣掉 "+it.ic+it.name+"，🪙+"+sellPrice(it));
}

/* ====== 衣櫃換裝：上衣/褲子/髮圈/髮夾 各10種 ====== */
function openWard(){
  buildDoll(document.getElementById("dollPreview"));
  const body=document.getElementById("wardBody"); body.innerHTML="";
  CATDEFS.forEach(cat=>{
    const owned=ITEMS.filter(i=>i.type===cat.type&&S.wardrobe.includes(i.id)).length;
    const head=document.createElement("div"); head.className="wcat"; head.textContent=`${cat.label}（${owned}/10）`;
    const g=document.createElement("div"); g.className="wardgrid";
    ITEMS.filter(i=>i.type===cat.type).forEach(it=>{
      const own=S.wardrobe.includes(it.id), on=S.equip[cat.type]===it.id;
      const d=document.createElement("div"); d.className="witem"+(own?"":" locked")+(on?" on":"");
      d.innerHTML=`<div class="wi">${it.ic}</div><div class="wn">${own?it.name:"？？？"}</div>`;
      if(own) d.onclick=()=>{ S.equip[cat.type]=on?null:it.id; save(); render(); openWard(); };
      g.appendChild(d);
    });
    body.appendChild(head); body.appendChild(g);
  });
  openSheet("wardWrap");
}

function openSheet(id){ document.getElementById(id).classList.remove("hidden"); }
function closeSheet(id){ document.getElementById(id).classList.add("hidden"); }
function speak(t){ if(!t||!window.speechSynthesis) return; const u=new SpeechSynthesisUtterance(t); u.lang="en-US"; u.rate=.85; speechSynthesis.cancel(); speechSynthesis.speak(u); }
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1000); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

if(S){ document.getElementById("nameInput").value=S.name||""; }
</script>
</body>
